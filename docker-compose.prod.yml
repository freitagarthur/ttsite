# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    # Recarrega o Nginx a cada 12h para aplicar certificados renovados
    command: ["/bin/sh", "-c", "while :; do sleep 12h; nginx -s reload; done & nginx -g 'daemon off;'"]

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

  db:
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  redis:
    logging: *logging
  backend:
    logging: *logging
  worker:
    logging: *logging
  frontend:
    logging: *logging
